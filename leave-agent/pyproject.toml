[project]
name = "leave-agent"
version = "0.1.0"
description = "Autonomous Leave Approval Agent"
authors = [
    {name = "Sam Weeks", email = "samweeks92@gmail.com"},
]

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.5.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-firestore>=2.14.0",
    "google-cloud-logging>=3.10.0",
    "pydantic>=2.0.0",
    "sse-starlette>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
requires-python = ">=3.11,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
